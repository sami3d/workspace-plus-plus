name: SpaceRenamer
options:
  bundleIdPrefix: com.saint
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  SpaceRenamerCore:
    path: .
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  SpaceRenamer:
    type: application
    platform: macOS
    sources:
      - path: SpaceRenamerApp
    resources:
      - SpaceRenamerApp/Resources/Assets.xcassets
    info:
      path: SpaceRenamerApp/App/Info.plist
      properties:
        CFBundleName: Workspace++
        CFBundleDisplayName: Workspace++
        # Pin the version here so xcodegen regenerates Info.plist with the
        # right values every time. Without these explicit pins it resets
        # `CFBundleShortVersionString` to "1.0" / `CFBundleVersion` to "1" on
        # every regenerate, silently dropping any committed version bump.
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAppleEventsUsageDescription: Workspace++ reads Chrome window and tab URLs only to save and restore workspace sessions you control.
        WorkspaceCloudURL: https://djzumrvobmvfspnmxnqr.supabase.co
        # Safe to embed in the desktop client. Access is enforced by Auth + RLS;
        # never replace this with a secret/service-role key.
        WorkspaceCloudPublishableKey: sb_publishable_pUG_lQD49bjeZWl7WBWEiQ_LJf9tXFs
    settings:
      base:
        # Keep the historical target/module and bundle identifier for upgrade
        # compatibility; PRODUCT_NAME is the user-facing app bundle/executable.
        PRODUCT_NAME: "Workspace++"
        PRODUCT_BUNDLE_IDENTIFIER: com.saint.SpaceRenamer
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: "SpaceRenamerApp/App/SpaceRenamer-Bridging-Header.h"
        # Stable self-signed identity so the Accessibility (TCC) grant survives
        # rebuilds (ad-hoc "-" had no stable Designated Requirement, so TCC never
        # honored the grant and synthesized switches were silently dropped).
        # Recreate the cert with scripts/create-signing-cert.sh if missing.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "SpaceRenamer Dev"
        CODE_SIGNING_REQUIRED: YES
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: SpaceRenamerCore
        product: SpaceRenamerCore
      - package: KeyboardShortcuts
      - target: WorkspacePlusChromeHost
    postBuildScripts:
      - name: Embed Workspace++ Chrome native host
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/WorkspacePlusChromeHost" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/WorkspacePlusChromeHost"
          cp -R "$SRCROOT/ChromeExtension" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ChromeExtension"

  WorkspacePlusChromeHost:
    type: tool
    platform: macOS
    sources:
      - path: ChromeNativeHost
    settings:
      base:
        PRODUCT_NAME: WorkspacePlusChromeHost
        PRODUCT_BUNDLE_IDENTIFIER: com.saint.SpaceRenamer.ChromeHost
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "SpaceRenamer Dev"
        CODE_SIGNING_REQUIRED: YES
